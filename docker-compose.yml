services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: piitrade
      POSTGRES_PASSWORD: piitrade
      POSTGRES_DB: piitrade
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U piitrade"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://piitrade:piitrade@postgres:5432/piitrade
      PORT: 4000
      UPLOAD_DIR: /app/uploads
      # Set these to real secrets before deploying publicly.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
      ADMIN_SETUP_CODE: ${ADMIN_SETUP_CODE:-}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pg_data:
  uploads:
