services:
  # Backend Web Service
  - type: web
    name: backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon # Ensure all services are in the same region for free internal networking
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: UPLOAD_DIR
        value: /var/data/uploads # Moved to Render's persistent disk path
      - key: FRONTEND_URL
        value: https://backend.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: piitrade-postgres
          property: connectionString
    disk:
      name: piitrade-uploads
      mountPath: /var/data/uploads
      sizeGB: 1

  # Frontend Web Service
  - type: web
    name: piitrade-frontend
    env: docker
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon

databases:
  - name: piitrade-postgres
    databaseName: piitrade
    user: piitrade
    plan: free
