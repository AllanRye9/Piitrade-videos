server {
    listen 80;
    server_name _;

    # Videos can be large (up to the 500MB multer limit) and mobile
    # uploads happen over slow/flaky connections, so give the client
    # generous time to finish sending the request body instead of
    # nginx's 60s default (which otherwise surfaces as a confusing
    # "upload failed" with no useful message on slower networks).
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;
    keepalive_timeout 65s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream the request body straight to the backend instead of
        # buffering the whole file on disk first — faster and avoids
        # extra latency/timeouts on large video uploads.
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
