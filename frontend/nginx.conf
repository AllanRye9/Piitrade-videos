server {
    listen 80;
    server_name _;

    # Videos can be large (up to the 500MB multer limit) and mobile
    # uploads happen over slow/flaky connections, so give the client
    # generous time to finish sending the request body instead of
    # nginx's 60s default (which otherwise surfaces as a confusing
    # "upload failed" with no useful message on slower networks).
    client_max_body_size 500M;
    client_body_timeout 300s;
    client_header_timeout 60s;
    send_timeout 300s;
    keepalive_timeout 65s;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # Crawler-facing routes are generated by the backend (routes/seo.ts):
    #  - /v/<id> is the shared-video page, served with real <title>, Open Graph
    #    and JSON-LD tags so link previews and search engines see the video.
    #    If the backend is down, fall back to the plain SPA shell.
    #  - /robots.txt and /sitemap.xml need the public origin and the video list.
    location ~ ^/v/[^/]+$ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @spa;
    }
    location = / {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }
    location ~ ^/legal/[a-z]+/?$ {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @spa;
    }
    location = /robots.txt {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location = /sitemap.xml {
        proxy_pass http://backend:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
    location @spa {
        rewrite ^ /index.html break;
    }

    # The admin dashboard must never be indexed (belt and braces with robots.txt
    # and the <meta robots> the app sets itself).
    location ^~ /const/admin {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.html;
    }
    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri /index.html;
    }

    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream the request body straight to the backend instead of
        # buffering the whole file on disk first — faster and avoids
        # extra latency/timeouts on large video uploads.
        proxy_request_buffering off;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /uploads/ {
        proxy_pass http://backend:4000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
