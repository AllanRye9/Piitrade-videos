name: Build Android APK

# Builds an installable APK of the React Native (Expo) app in mobile/.
# The native android/ project is generated on the runner by `expo prebuild`
# (Continuous Native Generation), so nothing native is checked in.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Inlined into the JS bundle by Expo at build time.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend URL
        working-directory: .
        run: test -n "$EXPO_PUBLIC_API_BASE_URL" || { echo 'Set the API_BASE_URL repository variable (Settings → Secrets and variables → Actions → Variables), e.g. https://api.example.com' >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Locate APK
        id: apk
        run: echo "path=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: piitrade-videos-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
