name: Build Android APK

# Builds an installable APK of the React Native (Expo) app in mobile/.
# The native android/ project is generated on the runner by `expo prebuild`
# (Continuous Native Generation), so nothing native is checked in.

on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'CPU architectures to build. arm64-v8a = every modern phone and the fastest build; all = also 32-bit ARM and x86_64 emulators (about 3x the native compile time).'
        type: choice
        default: arm64-v8a
        options: [arm64-v8a, all]
  push:
    branches: [main]
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Inlined into the JS bundle by Expo at build time.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}
      CI: '1'
      # The native C++ compile (Hermes/codegen/libraries) repeats once per architecture, so it dominates build
      # time. Day-to-day builds target arm64-v8a only; tagged releases and the "all" choice build everything
      # a real device or the emulator might need.
      ABIS: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.abis == 'all') && 'armeabi-v7a,arm64-v8a,x86_64' || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend URL
        working-directory: .
        run: test -n "$EXPO_PUBLIC_API_BASE_URL" || { echo 'Set the API_BASE_URL repository variable (Settings → Secrets and variables → Actions → Variables), e.g. https://api.yotweek.com' >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Environment
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          java -version 2>&1 | head -1
          echo "ABIS=$ABIS"
          echo "### Build settings" >> "$GITHUB_STEP_SUMMARY"
          echo "- Architectures: \`$ABIS\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- API base: \`$EXPO_PUBLIC_API_BASE_URL\`" >> "$GITHUB_STEP_SUMMARY"

      # Cheap checks first: a type error or failing test stops the run in under a minute instead of after
      # the 10+ minute native build.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      # Settings the generated project doesn't pick for a one-off CI build. Written into gradle.properties
      # (visible in the log below) so the build can be reproduced locally.
      - name: Tune Gradle for CI
        working-directory: mobile/android
        run: |
          set -euo pipefail
          for key in org.gradle.jvmargs org.gradle.caching android.enablePngCrunchInReleaseBuilds reactNativeArchitectures; do
            sed -i "/^${key//./\\.}=/d" gradle.properties
          done
          # The generated file may not end in a newline; without this the first line below would be glued
          # onto the last existing setting and corrupt it.
          [ -z "$(tail -c1 gradle.properties)" ] || echo >> gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC'
            echo 'org.gradle.caching=true'
            echo 'android.enablePngCrunchInReleaseBuilds=false'
            echo "reactNativeArchitectures=$ABIS"
          } >> gradle.properties
          echo '--- gradle.properties ---'
          grep -v '^#' gradle.properties | grep -v '^$'

      - name: Build release APK
        id: build
        working-directory: mobile/android
        timeout-minutes: 40
        run: ./gradlew assembleRelease --no-daemon --build-cache --console=plain --warning-mode summary --stacktrace

      # On failure, keep what is needed to find the cause without re-running: Gradle's reports, the native
      # (CMake) logs and the exact properties used.
      - name: Collect build diagnostics
        if: failure()
        run: |
          mkdir -p diagnostics
          cp android/gradle.properties diagnostics/ 2>/dev/null || true
          cp -r android/app/build/reports diagnostics/reports 2>/dev/null || true
          find android/app/.cxx -name '*.txt' -size -2M -exec cp --parents {} diagnostics/ \; 2>/dev/null || true
          echo "Diagnostics collected:"; find diagnostics -type f | head -40

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-build-diagnostics
          path: mobile/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      # upload-artifact resolves paths from the repo root, not from the
      # job's default working-directory, so the path includes mobile/.
      - uses: actions/upload-artifact@v4
        with:
          name: piitrade-videos-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Summary
        if: success()
        run: |
          {
            echo "### APK"
            ls -lh android/app/build/outputs/apk/release/*.apk | awk '{print "- `" $9 "` — " $5}'
          } >> "$GITHUB_STEP_SUMMARY"
