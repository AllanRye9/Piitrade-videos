name: Build Android APK

# Builds an installable APK of the React Native (Expo) app in mobile/.
# The native android/ project is generated on the runner by `expo prebuild`
# (Continuous Native Generation), so nothing native is checked in.

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/android-apk.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      # Inlined into the JS bundle by Expo at build time.
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.API_BASE_URL }}
      EXPO_PUBLIC_WEB_URL: ${{ vars.WEB_URL }}
      CI: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend URL
        working-directory: .
        run: test -n "$EXPO_PUBLIC_API_BASE_URL" || { echo 'Set the API_BASE_URL repository variable (Settings → Secrets and variables → Actions → Variables), e.g. https://v.piitrade.com' >&2; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # Warning only (a backend outage must not block a build). Catches the "HTTP 404 on every request" build:
      # the address baked into the app doesn't serve /api.
      - name: Check the backend answers
        run: |
          BASE=$(node --experimental-strip-types --no-warnings -e "import('./src/lib/apiBase.ts').then((m) => console.log(m.resolveApiBase(process.env.EXPO_PUBLIC_API_BASE_URL)))")
          echo "API address baked into the app: $BASE"
          if curl -fsS --max-time 20 "$BASE/api/health" | grep -q '"ok":true'; then
            echo "Backend health check passed."
          else
            echo "::warning::$BASE/api/health did not answer {\"ok\":true}. An APK built now gets HTTP 404 on every request until /api is routed to the backend on that host."
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          node --version
          npm --version
          java -version
          if test -f android/gradle.properties; then
            cat android/gradle.properties
          else
            echo "Native Android project was not generated."
          fi

      # upload-artifact resolves paths from the repo root, not from the
      # job's default working-directory, so the path includes mobile/.
      - uses: actions/upload-artifact@v4
        with:
          name: piitrade-videos-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
